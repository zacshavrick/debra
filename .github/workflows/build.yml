name: Build

# Every push/PR: smoke test + Windows exe + web build (downloadable artifacts).
# Pushes to main also deploy the web build to GitHub Pages (play on a phone).
# Tags like v0.2.0 attach the exe and a web zip to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read Godot version
        run: echo "GODOT_VERSION=$(tr -d '[:space:]' < GODOT_VERSION)" >> "$GITHUB_ENV"

      - name: Cache Godot + export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -sSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/tpl.zip
          unzip -q /tmp/tpl.zip -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import assets
        run: ~/godot/godot --headless --path game --import || true

      - name: Smoke test
        run: |
          ~/godot/godot --headless --path game --quit-after 200000 res://tests/smoke_test.tscn 2>&1 | tee /tmp/smoke.log
          grep -q "SMOKE TEST PASSED" /tmp/smoke.log

      - name: Export Windows + Web
        run: |
          mkdir -p builds/windows builds/web
          ~/godot/godot --headless --path game --export-release "Windows" ../builds/windows/Debra.exe
          ~/godot/godot --headless --path game --export-release "Web" ../builds/web/index.html
          test -f builds/windows/Debra.exe && test -f builds/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: Debra-windows
          path: builds/windows/Debra.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Debra-web
          path: builds/web

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

      - name: Attach builds to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          (cd builds/web && zip -qr ../Debra-web.zip .)
          gh release create "$GITHUB_REF_NAME" builds/windows/Debra.exe builds/Debra-web.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
